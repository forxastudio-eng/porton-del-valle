backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: "lotes"
    label: "Lotes — Portón del Valle"
    files:
      - name: "lots"
        label: "Lotes del proyecto"
        file: "data/lots.json"
        fields:
          - name: "lots"
            label: "Lotes"
            widget: "list"
            summary: "{{fields.code}} — {{fields.status}}"
            fields:
              - { name: "code", label: "Código del lote", widget: "string", hint: "Ej: A63. Debe ser único." }
              - name: "status"
                label: "Estado"
                widget: "select"
                default: "disponible"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Reservado", value: "reservado" }
                  - { label: "No disponible", value: "no_disponible" }
              - { name: "area", label: "Área (m²)", widget: "number", value_type: "float", required: false, hint: "Déjalo vacío si no aplica." }
              - { name: "price", label: "Precio (USD)", widget: "number", value_type: "float", required: false, hint: "Déjalo vacío si no aplica." }
              - { name: "cx", label: "Posición en el mapa — horizontal (0 a 100)", widget: "number", value_type: "float", hint: "0 = borde izquierdo del mapa, 100 = borde derecho. Para un lote nuevo, prueba un valor y revisa cómo se ve en el sitio." }
              - { name: "cy", label: "Posición en el mapa — vertical (0 a 100)", widget: "number", value_type: "float", hint: "0 = arriba del mapa, 100 = abajo." }
